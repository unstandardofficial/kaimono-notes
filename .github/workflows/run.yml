name: auto-post

on:
  schedule:
    # 毎時17分に起動。各アカウントは accounts/*.json の run_hours（日本時間）の回だけ動く
    - cron: "17 * * * *"
  workflow_dispatch:      # 「Run workflow」ボタンで手動実行（初回の確認用）
    inputs:
      account:
        description: "このアカウントだけ動かす（空なら全アカウント）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: 記事作成とSNS投稿
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 使う鍵だけを名前で渡す（全Secretsをまとめて渡すとGitHubに危険な設定と判定される）
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          THREADS_ACCESS_TOKEN_KURASHI: ${{ secrets.THREADS_ACCESS_TOKEN_KURASHI }}
          THREADS_ACCESS_TOKEN_KITCHEN: ${{ secrets.THREADS_ACCESS_TOKEN_KITCHEN }}
          THREADS_ACCESS_TOKEN_KOSODATE: ${{ secrets.THREADS_ACCESS_TOKEN_KOSODATE }}
          THREADS_ACCESS_TOKEN_OTORIYOSE: ${{ secrets.THREADS_ACCESS_TOKEN_OTORIYOSE }}
          THREADS_ACCESS_TOKEN_GADGET: ${{ secrets.THREADS_ACCESS_TOKEN_GADGET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MANUAL_ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$MANUAL_ACCOUNT" ]; then python -m bot.main --account "$MANUAL_ACCOUNT"; else python -m bot.main --all; fi
          else
            python -m bot.main
          fi
      - name: 記事と状態を保存
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "auto-post-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "auto: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') の投稿"
          git push
