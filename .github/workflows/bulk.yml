name: bulk-drafts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/bulk-trigger"]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.p.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "slugs=$(python3 -c "import json;print(json.dumps(open('.github/bulk-trigger').read().split()))")" >> "$GITHUB_OUTPUT"
  make:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 下書きをまとめて作る
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot.bulk ${{ matrix.slug }}
      - name: 保存
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "auto-post-bot@users.noreply.github.com"
          git add data/bulk
          git diff --cached --quiet && exit 0
          git commit -m "bulk: ${{ matrix.slug }} の下書き"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 10; done
