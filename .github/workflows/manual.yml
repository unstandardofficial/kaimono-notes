name: manual-post

on:
  push:
    branches: [main]
    paths: ["data/manual_queue.json"]
  schedule:
    - cron: "47 * * * *"   # 予約時刻を過ぎた承認済み投稿を毎時47分に出す
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 承認済みの予約投稿
        env:
          # 使う鍵だけを名前で渡す（全Secretsをまとめて渡すとGitHubに危険な設定と判定される）
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          THREADS_ACCESS_TOKEN_KURASHI: ${{ secrets.THREADS_ACCESS_TOKEN_KURASHI }}
          THREADS_ACCESS_TOKEN_KITCHEN: ${{ secrets.THREADS_ACCESS_TOKEN_KITCHEN }}
          THREADS_ACCESS_TOKEN_KOSODATE: ${{ secrets.THREADS_ACCESS_TOKEN_KOSODATE }}
          THREADS_ACCESS_TOKEN_OTORIYOSE: ${{ secrets.THREADS_ACCESS_TOKEN_OTORIYOSE }}
          THREADS_ACCESS_TOKEN_GADGET: ${{ secrets.THREADS_ACCESS_TOKEN_GADGET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m bot.manual_post
      - name: 結果を保存
        if: always()
        run: |
          git config user.name "auto-post-bot"
          git config user.email "auto-post-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "manual: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') の予約投稿"
          git pull --rebase -q && git push
